<!doctype html>
<!--
  Schülerseite mit dem QR-Code zur Antwortkarte (siehe make_qr.py):
  A4 hochkant, rein schwarz-weiß.
-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Antwortkarte – QR-Code</title>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <style>
    @page { size: A4 portrait; margin: 0; }

    html, body { margin: 0; height: 297mm; overflow: hidden; }

    body {
      width: 210mm;
      height: 297mm;
      color: #000;
      background: #fff;
      font-family: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
      font-size: 16pt;
      line-height: 1.4;
    }

    .page {
      height: 100%;
      padding: 20mm 20mm 14mm;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12mm;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 48pt;
      line-height: 1;
    }

    .lead { margin: 0; font-size: 18pt; }

    .code {
      border: 3px solid #000;
      border-radius: 8mm;
      padding: 8mm;
    }

    .code img { width: 110mm; display: block; }

    ol {
      margin: 0;
      padding-left: 9mm;
      display: flex;
      flex-direction: column;
      gap: 3mm;
      font-size: 17pt;
      text-align: left;
    }

    footer { margin-top: auto; font-size: 11pt; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Antwortkarte</h1>
    <p class="lead">
      Dein iPad wird zur Antwortkarte: A, B, C oder D hochhalten.
    </p>

    <div class="code">
      <img src="qr-karte.svg" alt="QR-Code zur Antwortkarte">
    </div>

    <ol>
      <li>Kamera-App öffnen und auf den QR-Code halten.</li>
      <li>Auf den Link tippen.</li>
      <li>Zu A, B, C oder D wischen und das iPad hochhalten.</li>
    </ol>

    <footer>4er-Quiz · walteroelf.github.io/4erQuiz1</footer>
  </div>
</body>
</html>
